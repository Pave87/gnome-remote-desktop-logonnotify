name: Build and publish

on:
  push:
    branches: [main]
  schedule:
    # Daily, to pick up new Ubuntu versions of gnome-remote-desktop
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the version is already published
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install build tools
        run: |
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            dpkg-dev devscripts quilt apt-utils gnupg curl ca-certificates
          DEBIAN_FRONTEND=noninteractive apt-get build-dep -y gnome-remote-desktop

      - name: Build
        id: build
        env:
          OUT: ${{ runner.temp }}/out
          PUBLISHED_PACKAGES: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/Packages
          FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: |
          bash ./build.sh
          if [ -f "$OUT/VERSION" ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create signed apt repository
        if: steps.build.outputs.built == 'true'
        env:
          SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
        run: |
          echo "$SIGNING_KEY" | gpg --batch --import
          fpr=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ { print $10; exit }')
          bash ./publish.sh "${{ runner.temp }}/out" "${{ runner.temp }}/site" "$fpr" \
            "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - uses: actions/upload-pages-artifact@v5.0.0
        if: steps.build.outputs.built == 'true'
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
